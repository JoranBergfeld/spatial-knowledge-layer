[project]
name = "spatial-service"
version = "0.1.0"
description = "The service: answers a turn about the venue from the current snapshot."
requires-python = ">=3.12"
dependencies = [
    "spatial-core",
    "agent-framework-core>=1.20",
    "agent-framework-openai>=1.15",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.scripts]
spatial-service = "spatial_service.app:main"

[tool.uv.sources]
spatial-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_service"]
