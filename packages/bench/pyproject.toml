[project]
name = "spatial-bench"
version = "0.1.0"
description = "The evaluation harness: question sets, a scripted model, tool correctness and the two leak checks."
requires-python = ">=3.12"
dependencies = [
    "spatial-core",
    "spatial-ingest",
    "spatial-service",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[project.scripts]
bench = "spatial_bench.cli:main"

[tool.uv.sources]
spatial-core = { workspace = true }
spatial-ingest = { workspace = true }
spatial-service = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_bench"]
