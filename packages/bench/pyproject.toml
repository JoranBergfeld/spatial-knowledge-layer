[project]
name = "spatial-bench"
version = "0.1.0"
description = "The evaluation harness: question sets, a scripted model, tool correctness, the two leak checks and evaluation runs."
requires-python = ">=3.12"
dependencies = [
    "spatial-core",
    "spatial-ingest",
    "spatial-service",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "fastapi>=0.115",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
# The NLI model an evaluation run scores entailment with. Only a real run needs it.
nli = [
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "numpy>=1.26",
]

[project.scripts]
bench = "spatial_bench.cli:main"

[tool.uv.sources]
spatial-core = { workspace = true }
spatial-ingest = { workspace = true }
spatial-service = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_bench"]
