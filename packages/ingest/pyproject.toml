[project]
name = "spatial-ingest"
version = "0.1.0"
description = "Ingestion CLI: builds a snapshot bundle from pinned inputs."
requires-python = ">=3.12"
dependencies = [
    "spatial-core",
    "httpx>=0.27",
    "shapely>=2.0",
    # pyosmium. Only the regional extract fallback needs it.
    "osmium>=4.0",
    "psycopg[binary]>=3.2",
    "pypdf>=5.0",
]

[project.scripts]
ingest = "spatial_ingest.cli:main"

[tool.uv.sources]
spatial-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_ingest"]
