[project]
name = "spatial-core"
version = "0.1.0"
description = "Record models and rules shared by ingestion and the (future) service."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_core"]
