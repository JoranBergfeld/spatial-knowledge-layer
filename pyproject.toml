[project]
name = "spatial-knowledge-layer"
version = "0.1.0"
description = "Workspace root. The deployables live under packages/."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
spatial-core = { workspace = true }
spatial-ingest = { workspace = true }
spatial-service = { workspace = true }
spatial-bench = { workspace = true }

[dependency-groups]
dev = [
    "spatial-core",
    "spatial-ingest",
    "spatial-service",
    "spatial-bench",
    "pytest",
    "ruff",
    "mypy",
    "types-shapely",
    "types-openpyxl",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"
pythonpath = ["packages/ingest/tests", "packages/service/tests", "packages/bench/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# gold/ is not a package of the workspace, on purpose. Its modules import each other by bare name.
src = [
    "packages/*/src",
    "packages/ingest/tests",
    "packages/service/tests",
    "packages/bench/tests",
    "gold",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "packages/core/src",
    "packages/ingest/src",
    "packages/service/src",
    "packages/bench/src",
    "gold",
]
