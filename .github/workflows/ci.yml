name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The load and promote tests run against a real Postgres, each in a database of its own.
    # With pgvector, for the search index tests.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mdformat --check README.md

      - name: Typecheck
        run: uv run mypy

      - name: Test
        env:
          SPATIAL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest --ignore=packages/bench

      # Everything below is the evaluation's deterministic half. No model is called:
      # the planner and the composer are scripted. The test bench here is the small
      # hand-made handover in packages/ingest/tests, never the real one.

      - name: Gold generation
        # -I -S: no site-packages, so the gold scripts cannot import the layer.
        run: |
          uv run python -I -S gold cobie \
            --workbook packages/ingest/tests/handover_fixture/handover.xlsx \
            --ocr packages/ingest/tests/handover_fixture/ocr \
            --out "$RUNNER_TEMP/gold.json"

      - name: Invariants, tool correctness and both leak checks
        # Builds and loads the bench and the mini campus, which runs the load
        # invariants, then asks every gold question. A leak fails this step.
        # Evaluation runs are tested here too, with the same scripted model and a
        # stand-in for the NLI model. No real run is ever started in CI.
        env:
          SPATIAL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest packages/bench
